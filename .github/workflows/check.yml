name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test metadata sync without Apple credentials or API access
        run: python3 -m unittest discover -s scripts/tests -v
  check:
    runs-on: ubuntu-latest
    container: swift:6.4.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Trust the mounted checkout in this ephemeral container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash scripts/swift-style check
      - run: swift build --jobs 4 -c release
      - run: swift test --jobs 4
  native:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Apple toolchain
        run: |
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          grep -Fx 'Xcode 27.1' <<< "$xcode_version"
          grep -Fx 'Build version 27A9275' <<< "$xcode_version"
          simulator_sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          printf '%s\n' "$simulator_sdk_version"
          grep -E '^27\.' <<< "$simulator_sdk_version"
          xcrun swift --version
      - name: Build unsigned simulator app
        run: >-
          xcodebuild -project Compass.xcodeproj -scheme Compass
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build
      - name: Test on an available iPhone simulator
        run: bash scripts/test-ios
  watch:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Wait for simulator runtime mounts
        run: python3 scripts/prepare-watch-runtime
      - name: Build unsigned Watch app
        run: >-
          xcodebuild -project Compass.xcodeproj -scheme CompassWatch
          -destination 'generic/platform=watchOS Simulator'
          -derivedDataPath .build/watch CODE_SIGNING_ALLOWED=NO build
      - name: Test on an available Watch simulator
        run: bash scripts/test-watch
      - name: Diagnose Watch runtime failure
        if: failure()
        run: python3 scripts/watch-runtime-diagnostics
